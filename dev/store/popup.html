<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Downshelf toolbar popup showcase (1280×800)</title>
    <link rel="stylesheet" href="store.css" />
    <style>
      body { width: 1280px; height: 800px; display: flex; align-items: center; padding: 0 120px; gap: 110px; }
      .copy { flex: 1; }
      .logo { width: 72px; height: 72px; margin-bottom: 30px; }
      h1 { margin: 0 0 18px; font-size: 52px; line-height: 1.08; font-weight: 760; letter-spacing: -0.025em; }
      p { margin: 0 0 30px; font-size: 22px; line-height: 1.5; opacity: 0.9; }
      ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; font-size: 19px; }
      li { display: flex; gap: 12px; align-items: center; }
      li::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0.8; }
      .frame { width: 360px; height: 560px; border-radius: 16px; overflow: hidden; background: #fff;
        box-shadow: 0 40px 90px -20px rgb(10 8 60 / 0.65), 0 0 0 1px rgb(255 255 255 / 0.25); }
      iframe { width: 360px; height: 560px; border: 0; display: block; }
    </style>
  </head>
  <body>
    <div class="copy">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#fff" fill-opacity="0.16"/><rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#fff" stroke-opacity="0.35"/><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6.5v11"/><path d="m11.25 13 4.75 4.75L20.75 13"/><path d="M7.5 23.5h17"/><path d="M10.5 23.5V26M21.5 23.5V26" stroke-width="2.2"/></g></svg>
      <h1>Your downloads,<br />one click away</h1>
      <p>See which rules apply to the site you’re on, add one in a click, and check where recent files went.</p>
      <ul>
        <li>Pause and resume sorting</li>
        <li>Rules for the current site</li>
        <li>Recently sorted files</li>
      </ul>
    </div>
    <div class="frame"><iframe src="/popup/popup.html?shot=popup" title="Downshelf popup"></iframe></div>
  </body>
</html>
