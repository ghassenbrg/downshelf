<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Downshelf marquee (1400×560)</title>
    <link rel="stylesheet" href="store.css" />
    <style>
      body { width: 1400px; height: 560px; display: flex; align-items: center; padding: 0 110px; gap: 90px; }
      .brand { flex: 1; }
      .logo { width: 96px; height: 96px; margin-bottom: 28px; }
      h1 { margin: 0 0 14px; font-size: 64px; font-weight: 760; letter-spacing: -0.025em; }
      p { margin: 0; font-size: 24px; line-height: 1.45; opacity: 0.88; max-width: 520px; }
      .rules { display: flex; flex-direction: column; gap: 14px; font-size: 20px; }
      .row { display: flex; align-items: center; gap: 14px; }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#fff" fill-opacity="0.16"/><rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#fff" stroke-opacity="0.35"/><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6.5v11"/><path d="m11.25 13 4.75 4.75L20.75 13"/><path d="M7.5 23.5h17"/><path d="M10.5 23.5V26M21.5 23.5V26" stroke-width="2.2"/></g></svg>
      <h1>Downshelf</h1>
      <p>Every download lands in the right folder — by website, link, file name or type.</p>
    </div>
    <div class="rules">
      <div class="row"><span class="chip">*.github.com</span><span class="arrow">→</span><span class="chip">Development/GitHub</span></div>
      <div class="row"><span class="chip">labs.google</span><span class="arrow">→</span><span class="chip">AI/Flow</span></div>
      <div class="row"><span class="chip">invoice-*</span><span class="arrow">→</span><span class="chip">Finance/{year}</span></div>
      <div class="row"><span class="chip">*.pdf</span><span class="arrow">→</span><span class="chip">Documents</span></div>
    </div>
  </body>
</html>
