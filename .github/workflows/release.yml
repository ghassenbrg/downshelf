name: Release extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release (for example, v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify and package Chrome extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag matches versions and changelog
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: npm run release:verify -- "$RELEASE_TAG"

      - name: Lint, test, build and package
        run: |
          npm run validate
          npm run pack:chrome

      - name: Verify ZIP integrity and layout
        run: |
          unzip -t dist/packages/*.zip
          unzip -l dist/packages/*.zip | grep -qE '[[:space:]]manifest.json$'

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: npm run --silent release:notes -- "$RELEASE_TAG" > dist/packages/RELEASE_NOTES.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: downshelf-chrome
          path: |
            dist/packages/*.zip
            dist/packages/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub Release
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: downshelf-chrome
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so gh cannot infer the repository from .git.
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release/*.zip \
              --title "Downshelf $RELEASE_TAG" \
              --notes-file release/RELEASE_NOTES.md
          fi

  chrome-web-store:
    name: Upload to Chrome Web Store
    needs: github-release
    if: vars.CHROME_WEB_STORE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: downshelf-chrome
          path: release

      - name: Upload and submit with the Chrome Web Store API v2
        env:
          CHROME_WEB_STORE_CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CHROME_WEB_STORE_CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          CHROME_WEB_STORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
          CHROME_WEB_STORE_PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
          CHROME_WEB_STORE_EXTENSION_ID: ${{ vars.CHROME_WEB_STORE_EXTENSION_ID }}
          # Set to "staged" to require pressing Publish in the dashboard after approval.
          CHROME_WEB_STORE_PUBLISH_TYPE: ${{ vars.CHROME_WEB_STORE_PUBLISH_TYPE }}
        run: |
          PACKAGE="$(find release -name '*.zip' -print -quit)"
          test -n "$PACKAGE"
          node scripts/publish-chrome-web-store.mjs "$PACKAGE"
